name: Build & Deploy Land in Korea Blog

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

# sync-blog-posts.js가 새 글을 여러 개 연달아 푸시하면(한 번에 여러 주제가 밀려 있을
# 때) push 이벤트마다 이 워크플로가 거의 동시에 여러 번 트리거된다 — 각 실행이
# fetch_images.py에서 찾은 이미지를 content/posts/에 커밋해 되돌려 푸시하려 하는데,
# 동시 실행끼리 서로의 푸시를 앞지르면 "rejected (fetch first)"로 밀려서 그 실행은
# build/deploy 단계까지 가지도 못하고 죽는다(2026-08-31 실측 — 관광지 주제 6개를 한
# 번에 추가했을 때 6번 중 5번이 이렇게 실패함). daily-topic.yml과 동일한 방식으로
# 동시 실행을 막아 순서대로만 돌게 한다.
concurrency:
  group: land-in-korea-blog-build
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image/watermark dependencies
        run: pip install pillow

      - name: Fetch Korea-confirmed post images
        # GITHUB_TOKEN이 있어야 워터마크 합성 후 media-assets 브랜치에 호스팅할 수 있다
        # (2026-08-30, SNS 캡션 파이프라인과 동일한 워터마크 기준을 블로그 대표 이미지에도 적용).
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd automation
          python3 fetch_images.py

      - name: Commit fetched/watermarked image fields
        # fetch_images.py가 content/posts/*.md에 써넣은 image: 값이 지금까지 한 번도
        # 커밋된 적이 없었다(2026-08-30 실측 — 매 빌드마다 처음부터 다시 검색해야 했음).
        # 커밋해둬야 다음 빌드부터 이미 있는 이미지를 재사용하고, 검색 API 호출도 줄어든다.
        run: |
          if git diff --quiet -- content/posts/; then
            echo "No image field changes; no commit required."
            exit 0
          fi
          git config user.name "sns-automation-bot"
          git config user.email "actions@github.com"
          git add content/posts/
          git commit -m "chore: persist fetched/watermarked post images"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Build site
        run: |
          cd automation
          python3 build.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
